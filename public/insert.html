<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Event</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>Add New Event</h1>
        <form action="/add-event" method="POST">
            <div class="form-group">
                <label for="event_name">Event Name:</label>
                <input type="text" id="event_name" name="event_name" placeholder="e.g. Tech Fest" required>
            </div>

            <div class="form-group">
                <label for="event_time">Event Time:</label>
                <input type="time" id="event_time" name="event_time" required>
            </div>

            <div class="form-group">
                <label for="event_day">Event Date:</label>
                <input type="date" id="event_day" name="event_day" required>
            </div>

            <div class="form-group">
                <label for="venue">Venue:</label>
                <input type="text" id="venue" name="venue" placeholder="e.g. College Auditorium" required>
            </div>

            <div class="form-group">
                <label for="description">Description:</label>
                <textarea id="description" name="description" rows="3" placeholder="Brief event details..."></textarea>
            </div>

            <button type="submit" class="btn">Add Event</button>
        </form>

        <br>
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>
</body>
</html>
